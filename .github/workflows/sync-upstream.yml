name: Sync main with upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/smirgol/plugin.video.crunchyroll.git
          git fetch upstream main
          if git merge --no-edit upstream/main; then
            git push origin main
          else
            git merge --abort
            echo "::error::Merge conflict between main and upstream/main. Resolve manually."
            exit 1
          fi

  release:
    needs: sync
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.mirror.outputs.created }}
      tag: ${{ steps.mirror.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: smirgol/plugin.video.crunchyroll
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mirror latest stable upstream release
        id: mirror
        run: |
          # "latest" excludes pre-releases and drafts
          release=$(gh api "repos/${UPSTREAM}/releases/latest")
          tag=$(jq -r .tag_name <<<"$release")
          name=$(jq -r '.name // .tag_name' <<<"$release")
          jq -r '.body // ""' <<<"$release" > notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            exit 0
          fi

          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream main
          git fetch upstream "refs/tags/${tag}:refs/tags/upstream-${tag}"
          commit=$(git rev-list -n 1 "upstream-${tag}")

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$commit" \
            --title "$name" \
            --notes-file notes.md \
            --latest
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  notify-repository:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Kodi repository build
        env:
          # PAT with contents:write on the Kodi repository (releases made with
          # GITHUB_TOKEN cannot trigger other workflows or repositories)
          GH_TOKEN: ${{ secrets.KODI_REPO_TOKEN }}
          KODI_REPO: ${{ vars.KODI_REPO || 'shinn5112/shinn5112-kodi-repo' }}
        run: |
          gh api "repos/${KODI_REPO}/dispatches" \
            -f event_type=addon-release \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[tag]=${{ needs.release.outputs.tag }}"
